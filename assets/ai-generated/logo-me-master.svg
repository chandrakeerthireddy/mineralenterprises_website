<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mineral Enterprises  Master ME Logo (vector)
  Usage: header, print, favicon source, brand assets
  Colors: Green #1b3d2f / #2d5a45 · Gold #c8952e / #e4b04a
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" fill="none" role="img" aria-label="Mineral Enterprises ME mark">
  <defs>
    <linearGradient id="me-mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5a45"/>
      <stop offset="100%" stop-color="#1b3d2f"/>
    </linearGradient>
    <linearGradient id="me-eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4b04a"/>
      <stop offset="55%" stop-color="#c8952e"/>
      <stop offset="100%" stop-color="#a67c24"/>
    </linearGradient>
    <linearGradient id="me-eShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c45a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3d2a08" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="me-eDepth" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#2a1c06" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="0.3" flood-color="#f0c45a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Letter M -->
  <g id="letter-m">
    <path d="M4 88V8h15l20 32 20-32h15v80H62V48L42 72 22 48v40H4z" fill="url(#me-mGrad)"/>
    <path d="M11 62l4-9 3 7 5-11 4 8" stroke="#c8952e" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 70l3-5 2 4" stroke="#e4b04a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M9 54l2-4 1 3" stroke="#e4b04a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Letter E  spaced from M, with border shade -->
  <g id="letter-e" filter="url(#me-eDepth)">
    <rect x="108" y="8" width="11" height="80" fill="url(#me-eGrad)" stroke="#7a5718" stroke-width="1.4"/>
    <path d="M119 8h98l-13 13H128V8z" fill="url(#me-eGrad)" stroke="#7a5718" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M119 38h74v12H128v-12z" fill="url(#me-eGrad)" stroke="#7a5718" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M119 68h98l-13 13H128V68z" fill="url(#me-eGrad)" stroke="#7a5718" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="108" y="8" width="11" height="80" fill="url(#me-eShade)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
